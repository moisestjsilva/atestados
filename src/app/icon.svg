<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Shield Glow -->
  <path d="M 256 60 L 400 125 C 400 280 340 380 256 440 C 172 380 112 280 112 125 Z" fill="url(#glowGrad)"/>

  <!-- Main Shield -->
  <path d="M 256 75 L 380 135 C 380 270 326 362 256 418 C 186 362 132 270 132 135 Z" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Shield Accent -->
  <path d="M 256 95 L 360 145 C 360 258 312 342 256 392 C 200 342 152 258 152 145 Z" fill="#0f172a" opacity="0.95"/>

  <!-- Document Body -->
  <rect x="195" y="160" width="122" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <path d="M 285 160 L 317 192 L 285 192 Z" fill="#38bdf8"/>

  <!-- Medical Cross Accent -->
  <path d="M 280 210 H 320 V 270 H 280 V 310 H 220 V 270 H 180 V 210 H 220 V 170 H 280 Z" fill="#0284c7" opacity="0.25"/>

  <!-- Document Lines -->
  <line x1="215" y1="210" x2="265" y2="210" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <line x1="215" y1="232" x2="285" y2="232" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <line x1="215" y1="254" x2="250" y2="254" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

  <!-- Large Green Checkmark -->
  <path d="M 210 275 L 245 310 L 335 220" fill="none" stroke="url(#checkGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
