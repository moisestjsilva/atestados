<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Document Body (Blue Gradient) -->
  <g filter="url(#shadow)">
    <rect x="76" y="44" width="360" height="424" rx="44" fill="url(#blueGrad)" />
    <!-- Top right corner fold -->
    <path d="M 356 44 L 436 124 L 356 124 Z" fill="#93c5fd" opacity="0.9" />
    <!-- White inner sheet -->
    <rect x="108" y="84" width="296" height="344" rx="28" fill="#ffffff" />
  </g>

  <!-- Medical Cross (Vibrant Blue) -->
  <rect x="238" y="150" width="36" height="104" rx="10" fill="#1d4ed8" />
  <rect x="204" y="184" width="104" height="36" rx="10" fill="#1d4ed8" />

  <!-- Cyan Checkmark Badge (Bottom Right) -->
  <circle cx="334" cy="334" r="68" fill="url(#cyanGrad)" />
  <path d="M 302 334 L 324 356 L 368 310" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
