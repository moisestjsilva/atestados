<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Document Outline -->
  <path d="M 150 100 H 300 L 362 162 V 412 H 150 Z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fold Corner -->
  <path d="M 300 100 V 162 H 362" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Medical Cross -->
  <path d="M 236 170 H 276 V 230 H 336 V 270 H 276 V 330 H 236 V 270 H 176 V 230 H 236 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>

  <!-- Document Text Lines -->
  <line x1="190" y1="310" x2="310" y2="310" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <line x1="190" y1="345" x2="280" y2="345" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <line x1="190" y1="380" x2="250" y2="380" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>

  <!-- Vibrant Cyan Checkmark -->
  <path d="M 180 295 L 245 360 L 375 205" fill="none" stroke="url(#checkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
